name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&title_color=4F8CC9&text_color=9f9f9f&bg_color=151515&hide_border=true&icon_color=4F8CC9&hide_title=true&include_all_commits=true&disable_animations=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          core_version: 2.2.1
          fail_on_error: true
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || github.token }}

      - name: Set up Node.js for language card
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - name: Install language card dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck language card generator
        run: pnpm typecheck

      - name: Generate top languages card
        run: pnpm generate:top-langs
        env:
          GITHUB_TOKEN: ${{ secrets.README_STATS_TOKEN || github.token }}

      - name: Commit updated cards
        run: |
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update README stats"
          git push
